name: "Socle - Vérification de santé"

on:
  workflow_call:
    inputs:
      checks:
        required: true
        type: string

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Vérifier les services
        shell: bash
        env:
          CHECKS: ${{ inputs.checks }}
        run: |
          set -euo pipefail

          while IFS='|' read -r url allowed label; do
            [[ -z "${url// /}" ]] && continue
            [[ -n "$allowed" && -n "$label" ]] || exit 1

            success=false

            for attempt in 1 2 3 4; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' \
                --connect-timeout 3 --max-time 8 \
                "$url") || code=000

              if [[ ",$allowed," == *",$code,"* ]]; then
                echo "OK : $label (HTTP $code)"
                echo "- OK : $label (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
                success=true
                break
              fi

              [[ "$attempt" -eq 4 ]] || sleep 5
            done

            if [[ "$success" != true ]]; then
              echo "::error::$label indisponible (HTTP $code)"
              exit 1
            fi
          done <<< "$CHECKS"
