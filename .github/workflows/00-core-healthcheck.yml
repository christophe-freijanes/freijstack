# Health | Shared checks
# Fournit les vérifications de santé mutualisées.
name: "Health | Shared checks"

on:
  workflow_call:
    inputs:
      warmup_url:
        description: "URL used for warm-up probing (frontend or /v2/)"
        required: true
        type: string
      checks:
        description: |
          Multi-line checks:
          url|allowed_codes_csv|label
          Example:
          https://vault.freijstack.com/|200,301,302|Vault FE
        required: true
        type: string
      max_wait_seconds:
        required: false
        type: number
        default: 90
      warmup_interval_seconds:
        required: false
        type: number
        default: 5
      max_retries:
        required: false
        type: number
        default: 8
      sleep_between_retries:
        required: false
        type: number
        default: 10

permissions:
  contents: read
  actions: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: ⏳ Warm-up probe
        run: |
          set -euo pipefail

          MAX_WAIT="${{ inputs.max_wait_seconds }}"
          INTERVAL="${{ inputs.warmup_interval_seconds }}"
          PROBE_URL="${{ inputs.warmup_url }}"

          echo "🔍 Probing: $PROBE_URL"
          echo "⏳ Max wait: ${MAX_WAIT}s (interval: ${INTERVAL}s)"

          start_time=$(date +%s)

          for _ in $(seq 1 $((MAX_WAIT / INTERVAL))); do
            elapsed=$(( $(date +%s) - start_time ))

            code=$(curl -sL -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 \
              --max-time 10 \
              "$PROBE_URL" || echo "000")

            case "$code" in
              2*|3*|401)
                echo "✅ Service ready after ${elapsed}s (HTTP $code)"
                echo "## 🩺 Health Check" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "- Warm-up: **${elapsed}s** (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              *)
                echo "⏳ Waiting... ${elapsed}s (HTTP $code)"
                sleep "$INTERVAL"
                ;;
            esac
          done

          echo "⚠️ Timeout after ${MAX_WAIT}s - proceeding anyway"
          echo "## 🩺 Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Warm-up: **timeout (${MAX_WAIT}s)** - proceeding anyway" >> "$GITHUB_STEP_SUMMARY"

      - name: 🌐 Run checks (with retries)
        run: |
          set -euo pipefail

          MAX_RETRIES="${{ inputs.max_retries }}"
          SLEEP_BETWEEN="${{ inputs.sleep_between_retries }}"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 🌐 URL checks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Parse multi-line checks
          # Format per line: url|allowed_codes_csv|label
          while IFS= read -r line; do
            [ -z "$line" ] && continue

            url="${line%%|*}"
            rest="${line#*|}"
            allowed="${rest%%|*}"
            label="${rest##*|}"

            echo ""
            echo "🔎 Checking $label → $url"

            attempt=1
            success=false
            last_code="000"

            while [ "$attempt" -le "$MAX_RETRIES" ]; do
              code=$(curl -sL -o /dev/null -w "%{http_code}" \
                --connect-timeout 10 \
                --max-time 20 \
                "$url" || echo "000")

              last_code="$code"

              if echo ",$allowed," | grep -q ",$code,"; then
                echo "✅ OK (HTTP $code)"
                echo "- ✅ **$label**: HTTP $code (attempt $attempt/$MAX_RETRIES)" >> "$GITHUB_STEP_SUMMARY"
                success=true
                break
              fi

              echo "⚠️ HTTP $code (attempt $attempt/$MAX_RETRIES)"
              if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                sleep "$SLEEP_BETWEEN"
              fi
              attempt=$((attempt + 1))
            done

            if [ "$success" != "true" ]; then
              echo "❌ $label is DOWN after $MAX_RETRIES attempts"
              echo "- ❌ **$label**: FAILED after $MAX_RETRIES attempts (last HTTP $last_code)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done <<< "${{ inputs.checks }}"

      - name: ✅ Done
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **All checks passed**" >> "$GITHUB_STEP_SUMMARY"
