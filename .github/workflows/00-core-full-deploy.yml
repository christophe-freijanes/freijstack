name: "Socle - Orchestration des déploiements"

on:
  workflow_call:
    inputs:
      app_name:
        description: "Application name (portfolio, securevault, registry, etc.)"
        required: true
        type: string
      environment:
        description: "Target environment (staging or production)"
        required: true
        type: string
      deploy_dir:
        description: "VPS deployment directory"
        required: true
        type: string
      project_path:
        description: "Project subdirectory (e.g., saas/portfolio)"
        required: false
        type: string
        default: ""
      docker_compose_file:
        description: "Docker Compose file to use"
        required: false
        type: string
        default: "docker-compose.yml"
      run_migrations:
        description: "Run database migrations after deploy"
        required: false
        type: boolean
        default: false
      migrate_service:
        description: "Compose service name to run migrations in (e.g., backend)"
        required: false
        type: string
        default: "app"
      healthcheck_url:
        description: "URL de healthcheck HTTP(s)"
        required: false
        type: string
        default: ""
      custom_script:
        description: "Custom deployment script (bash)"
        required: false
        type: string
        default: ""
      skip_security:
        description: "Compatibility flag (not used here)"
        required: false
        type: boolean
        default: false
      skip_lint:
        description: "Compatibility flag (not used here)"
        required: false
        type: boolean
        default: false

    secrets:
      VPS_SSH_KEY:
        required: true
      VPS_SSH_HOST:
        required: true
      VPS_SSH_USER:
        required: true

      # Registry creds: optional at workflow_call level
      # We validate at runtime depending on env + whether images are private.
      REGISTRY_USER_STAGING:
        required: false
      REGISTRY_PASSWORD_STAGING:
        required: false
      REGISTRY_USER_PROD:
        required: false
      REGISTRY_PASSWORD_PROD:
        required: false

concurrency:
  group: vps-ssh-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy ${{ inputs.app_name }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Staggered Start (avoid SSH collisions)
        run: |
          set -euo pipefail
          DELAY=$((5 + RANDOM % 16))
          echo "⏳ Waiting ${DELAY}s"
          sleep "$DELAY"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts || true
          echo "SSH_OPTIONS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" >> "$GITHUB_ENV"

      - name: Deploy ${{ inputs.app_name }}
        run: |
          set -euo pipefail

          SSH_TARGET="${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}"
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [[ "${{ inputs.app_name }}" == "portfolio" && "${{ inputs.environment }}" == "production" && "$BRANCH" != "master" ]]; then
            echo "❌ Portfolio production requires master (got: $BRANCH)"
            exit 1
          fi

          # Pass all env vars to the remote script (secrets may be empty)
          REMOTE_ENV="APP_NAME='${{ inputs.app_name }}' \
          ENVIRONMENT='${{ inputs.environment }}' \
          DEPLOY_DIR='${{ inputs.deploy_dir }}' \
          PROJECT_PATH='${{ inputs.project_path }}' \
          COMPOSE_FILE='${{ inputs.docker_compose_file }}' \
          CUSTOM_SCRIPT='${{ inputs.custom_script }}' \
          GH_REPO='${{ github.repository }}' \
          GH_BRANCH='${BRANCH}' \
          GH_SHA='${{ github.sha }}' \
          REGISTRY_HOST='registry.freijstack.com' \
          REGISTRY_USER_PROD='${{ secrets.REGISTRY_USER_PROD }}' \
          REGISTRY_PASSWORD_PROD='${{ secrets.REGISTRY_PASSWORD_PROD }}' \
          REGISTRY_USER_STAGING='${{ secrets.REGISTRY_USER_STAGING }}' \
          REGISTRY_PASSWORD_STAGING='${{ secrets.REGISTRY_PASSWORD_STAGING }}'"

          read -r -a ssh_options <<< "$SSH_OPTIONS"
          ssh "${ssh_options[@]}" -i ~/.ssh/deploy_key "$SSH_TARGET" "$REMOTE_ENV" bash <<'DEPLOY_SCRIPT'
          set -euo pipefail
          export DOCKER_CLI_HINTS=false

          : "${APP_NAME:?}"
          : "${ENVIRONMENT:?}"
          : "${DEPLOY_DIR:?}"
          : "${COMPOSE_FILE:?}"
          : "${GH_REPO:?}"
          : "${GH_BRANCH:?}"
          : "${GH_SHA:?}"
          : "${REGISTRY_HOST:?}"

          # Enforce PROD creds only for production deployments
          if [ "$ENVIRONMENT" = "production" ]; then
            : "${REGISTRY_USER_PROD:?}"
            : "${REGISTRY_PASSWORD_PROD:?}"
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo "❌ Docker Compose not available on VPS"
            exit 1
          fi

          echo "🔒 Volume protection: enabled (never run docker compose down -v)"
          echo "🚀 Deploying ${APP_NAME} → ${ENVIRONMENT}"
          echo "📁 DEPLOY_DIR=${DEPLOY_DIR}"
          echo "📄 COMPOSE_FILE=${COMPOSE_FILE}"
          echo "🔀 BRANCH=${GH_BRANCH}"
          echo "🧾 SHA=${GH_SHA}"
          echo "📦 Registry host=${REGISTRY_HOST}"

          mkdir -p "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          if [ -d ".git" ]; then
            git -c safe.directory="$DEPLOY_DIR" fetch origin --tags
            git -c safe.directory="$DEPLOY_DIR" reset --hard "origin/${GH_BRANCH}"
            git -c safe.directory="$DEPLOY_DIR" clean -fd
          else
            git clone -b "${GH_BRANCH}" "https://github.com/${GH_REPO}.git" .
          fi

          if [ -n "${PROJECT_PATH:-}" ]; then
            cd "$PROJECT_PATH"
          fi

          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "❌ Compose file not found: $COMPOSE_FILE (cwd=$(pwd))"
            ls -lah
            exit 1
          fi

          # ==========================================================
          # Registry app: generate htpasswd (requires creds)
          # ==========================================================
          if [ "$APP_NAME" = "registry" ]; then
            if [ "$ENVIRONMENT" = "production" ]; then
              USER="${REGISTRY_USER_PROD:-}"
              PASS="${REGISTRY_PASSWORD_PROD:-}"
            else
              # staging: use staging creds if set, else fallback to prod
              USER="${REGISTRY_USER_STAGING:-${REGISTRY_USER_PROD:-}}"
              PASS="${REGISTRY_PASSWORD_STAGING:-${REGISTRY_PASSWORD_PROD:-}}"
            fi

            if [ -z "${USER:-}" ] || [ -z "${PASS:-}" ]; then
              echo "❌ Registry deploy requires credentials (env=${ENVIRONMENT})"
              exit 1
            fi

            echo "🔐 Generating .htpasswd for registry (${ENVIRONMENT})"
            docker run --rm httpd:2 htpasswd -Bbn "$USER" "$PASS" > .htpasswd
            ls -lah .htpasswd
          fi

          # ==========================================================
          # Non-registry apps: docker login if creds exist
          # ==========================================================
          if [ "$APP_NAME" != "registry" ]; then
            if [ "$ENVIRONMENT" = "production" ]; then
              LOGIN_USER="${REGISTRY_USER_PROD:-}"
              LOGIN_PASS="${REGISTRY_PASSWORD_PROD:-}"
            else
              LOGIN_USER="${REGISTRY_USER_STAGING:-}"
              LOGIN_PASS="${REGISTRY_PASSWORD_STAGING:-}"
            fi

            if [ -n "${LOGIN_USER}" ] && [ -n "${LOGIN_PASS}" ]; then
              echo "🔐 docker login ${REGISTRY_HOST} (env=${ENVIRONMENT})"
              echo "${LOGIN_PASS}" | docker login "${REGISTRY_HOST}" -u "${LOGIN_USER}" --password-stdin
            else
              echo "⚠️ No registry creds for env=${ENVIRONMENT}; compose pull may fail if images are private."
            fi
          fi

          # ==========================================================
          # Optional custom script hook
          # ==========================================================
          if [ -n "${CUSTOM_SCRIPT:-}" ]; then
            echo "🧩 Running custom script"
            bash -lc "${CUSTOM_SCRIPT}"
          fi

          # ==========================================================
          # Deploy logic (no volume deletion)
          # ==========================================================
          if [ "$ENVIRONMENT" = "production" ]; then
            echo "🟢 Production deploy: pull + up (no down)"
            docker compose -f "$COMPOSE_FILE" pull
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans
          else
            echo "🟡 Staging deploy: down (no -v) + pull + up"
            docker compose -f "$COMPOSE_FILE" down --remove-orphans || true
            docker compose -f "$COMPOSE_FILE" pull
            docker compose -f "$COMPOSE_FILE" up -d --build --remove-orphans
          fi

          echo "📊 Containers:"
          docker compose -f "$COMPOSE_FILE" ps

          echo "📦 Volumes:"
          docker volume ls
          DEPLOY_SCRIPT

      - name: Run Migrations
        if: inputs.run_migrations
        run: |
          set -euo pipefail
          read -r -a ssh_options <<< "$SSH_OPTIONS"
          ssh "${ssh_options[@]}" -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "cd ${{ inputs.deploy_dir }}/${{ inputs.project_path }} && docker compose exec -T ${{ inputs.migrate_service }} npm run migrate || true"

      - name: Post-deploy Healthcheck
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.healthcheck_url }}" ]; then
            echo "Checking: ${{ inputs.healthcheck_url }}"
            curl -fsS --retry 20 --retry-delay 3 --max-time 10 "${{ inputs.healthcheck_url }}"
          else
            echo "No healthcheck_url provided; skipping."
          fi

      - name: Deployment Summary
        if: success()
        run: |
          set -euo pipefail
          {
            echo "## ✅ Deployment Successful"
            echo "- App: ${{ inputs.app_name }}"
            echo "- Env: ${{ inputs.environment }}"
            echo "- Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
