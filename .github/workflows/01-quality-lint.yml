name: "Qualité - Analyse du code"

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint ciblé
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Contrôler les fichiers modifiés
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base=$(git merge-base HEAD "origin/$BASE_REF")
          elif [[ -n "$BEFORE_SHA" &&
                  ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$BEFORE_SHA"
          else
            base=$(git rev-parse HEAD^)
          fi

          git diff --name-only -z --diff-filter=ACMR \
            "$base" HEAD > "$RUNNER_TEMP/changed"

          mapfile -d '' -t files < "$RUNNER_TEMP/changed"

          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue

            case "$file" in
              *.py)
                echo "$file" >> "$RUNNER_TEMP/python"
                ;;
              *.sh)
                echo "$file" >> "$RUNNER_TEMP/bash"
                ;;
              .github/workflows/*.yml|.github/workflows/*.yaml)
                echo "$file" >> "$RUNNER_TEMP/workflows"
                ;;
              *.yml|*.yaml)
                echo "$file" >> "$RUNNER_TEMP/yaml"
                ;;
              *.ps1)
                echo "$file" >> "$RUNNER_TEMP/powershell"
                ;;
              *ansible*|*playbooks*|*roles*)
                echo "$file" >> "$RUNNER_TEMP/ansible"
                ;;
            esac
          done

      - name: Ruff
        shell: bash
        run: |
          set -euo pipefail
          [[ -s "$RUNNER_TEMP/python" ]] || exit 0
          python -m pip install --quiet ruff==0.15.6
          mapfile -t files < "$RUNNER_TEMP/python"
          ruff check "${files[@]}"

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          [[ -s "$RUNNER_TEMP/bash" ]] || exit 0
          mapfile -t files < "$RUNNER_TEMP/bash"
          shellcheck "${files[@]}"

      - name: Actionlint
        shell: bash
        run: |
          set -euo pipefail
          [[ -s "$RUNNER_TEMP/workflows" ]] || exit 0

          curl -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"

          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" \
            -C "$RUNNER_TEMP" actionlint

          mapfile -t files < "$RUNNER_TEMP/workflows"
          "$RUNNER_TEMP/actionlint" "${files[@]}"

      - name: Yamllint
        shell: bash
        run: |
          set -euo pipefail
          [[ -s "$RUNNER_TEMP/yaml" ]] || exit 0
          python -m pip install --quiet yamllint
          mapfile -t files < "$RUNNER_TEMP/yaml"
          yamllint "${files[@]}"

      - name: PowerShell
        shell: pwsh
        run: |
          $fileList = "$env:RUNNER_TEMP/powershell"
          if (-not (Test-Path $fileList)) { exit 0 }
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Get-Content $fileList | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -ErrorAction Stop
          }

      - name: Ansible
        shell: bash
        run: |
          set -euo pipefail
          [[ -s "$RUNNER_TEMP/ansible" ]] || exit 0
          python -m pip install --quiet ansible-lint
          mapfile -t files < "$RUNNER_TEMP/ansible"
          ansible-lint "${files[@]}"
