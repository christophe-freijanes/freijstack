# Quality | Static analysis
# Vérifie la syntaxe et la qualité du code du dépôt.
name: "Quality | Static analysis"

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install yamllint
        run: sudo apt-get update && sudo apt-get install -y yamllint
      - name: Run yamllint
        run: yamllint .

  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          set -euo pipefail
          if ! find . -name '*.sh' -print -quit | grep -q .; then
            echo "No shell scripts to lint"
            exit 0
          fi
          find . -name '*.sh' -print0 | xargs -0 shellcheck

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Run ruff
        run: ruff check .

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter '*.ps1'
          if (-not $files) {
            Write-Host 'No PowerShell scripts to lint'
            exit 0
          }
          $files | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -ErrorAction Stop
          }

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ansible-lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible ansible-lint
      - name: Run ansible-lint (if Ansible dirs present)
        run: |
          set -euo pipefail
          if ! find . -type d \( -name ansible -o -name playbooks -o -name roles \) -print -quit | grep -q .; then
            echo "No Ansible directories to lint"
            exit 0
          fi
          ansible-lint

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
      - name: Run markdownlint
        run: |
          set -euo pipefail
          if ! find . -name '*.md' -print -quit | grep -q .; then
            echo "No Markdown files to lint"
            exit 0
          fi
          markdownlint-cli2 "**/*.md" "#node_modules"

  workflow-syntax:
    name: Vérifier les workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Contrôle actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

  iac:
    name: Vérifier les IaC présents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Détecter les fichiers
        id: detect
        shell: bash
        run: |
          if find . -type f -name '*.tf' -print -quit | grep -q .; then
            echo 'terraform=true' >> "$GITHUB_OUTPUT"
          fi
          if find . -type f \( -name '*.cfn.yaml' -o -name '*.cfn.yml' -o -name '*cloudformation*.yaml' -o -name '*cloudformation*.yml' \) -print -quit | grep -q .; then
            echo 'cloudformation=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: hashicorp/setup-terraform@v3
        if: steps.detect.outputs.terraform == 'true'
      - name: Terraform fmt
        if: steps.detect.outputs.terraform == 'true'
        run: terraform fmt -check -recursive
      - uses: actions/setup-python@v6
        if: steps.detect.outputs.cloudformation == 'true'
        with:
          python-version: '3.11'
      - name: CloudFormation lint
        if: steps.detect.outputs.cloudformation == 'true'
        run: |
          python -m pip install cfn-lint
          find . -type f \( -name '*.cfn.yaml' -o -name '*.cfn.yml' -o -name '*cloudformation*.yaml' -o -name '*cloudformation*.yml' \) -print0 | xargs -0 cfn-lint
