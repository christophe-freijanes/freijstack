name: "Déploiement - Portfolio"

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "SHA Git complet (40 caractères) du build validé"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: portfolio-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Portfolio image
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.ref == 'refs/heads/master' &&
        vars.PORTFOLIO_DEPLOY_ENABLED == 'true'
      }}
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify successful master build
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail

          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "Invalid Git SHA"
            exit 1
          }

          git merge-base --is-ancestor "$SHA" origin/master || {
            echo "SHA not reachable from master"
            exit 1
          }

          runs="$(gh api -X GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/03-app-portfolio-build.yml/runs" \
            -f head_sha="$SHA" \
            -f branch=master \
            -f status=success \
            --jq '.workflow_runs | length')"

          [[ "$runs" -gt 0 ]] || {
            echo "No successful Portfolio build for this SHA"
            exit 1
          }

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login registry
        uses: docker/login-action@v4
        with:
          registry: registry.freijstack.com
          username: ${{ secrets.REGISTRY_USER_PROD }}
          password: ${{ secrets.REGISTRY_PASSWORD_PROD }}

      - name: Resolve Docker digest
        id: digest
        env:
          SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          IMAGE="registry.freijstack.com/portfolio:$SHA"

          DIGEST="$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{.Manifest.Digest}}')"

          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1

          echo "image=registry.freijstack.com/portfolio@$DIGEST" \
            >> "$GITHUB_OUTPUT"

  security:
    name: Validate Portfolio security
    needs: validate
    uses: ./.github/workflows/00-core-security-ci.yml
    with:
      environment: production
      scan_paths: saas/portfolio
      run_codeql: false
      run_trivy_image: true
      trivy_images: ${{ needs.validate.outputs.image }}
      registry_host: registry.freijstack.com
      gate_prod_only: true
      fail_on_gitleaks: true
      run_zap: true
      dast_url: https://portfolio.freijstack.com
    secrets:
      REGISTRY_USER_PROD: ${{ secrets.REGISTRY_USER_PROD }}
      REGISTRY_PASSWORD_PROD: ${{ secrets.REGISTRY_PASSWORD_PROD }}

  trivy-gate:
    name: Blocking Trivy image scan
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Login registry
        uses: docker/login-action@v4
        with:
          registry: registry.freijstack.com
          username: ${{ secrets.REGISTRY_USER_PROD }}
          password: ${{ secrets.REGISTRY_PASSWORD_PROD }}

      - name: Check vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: 'v0.76.0'
          scan-type: image
          image-ref: ${{ needs.validate.outputs.image }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ secrets.REGISTRY_USER_PROD }}
          TRIVY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD_PROD }}

  deploy-production:
    name: Deploy Portfolio production
    needs: [validate, security, trivy-gate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure verified SSH connection
        env:
          SSH_KEY: ${{ secrets.PORTFOLIO_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy validated image
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_USER: ${{ vars.PORTFOLIO_SSH_USER }}
        run: |
          set -euo pipefail

          [[ "$IMAGE" =~ ^registry\.freijstack\.com/portfolio@sha256:[a-f0-9]{64}$ ]]

          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-portfolio-safe '$IMAGE' --check &&
             sudo -n /usr/local/sbin/deploy-portfolio-safe '$IMAGE' --apply"
