name: "Maintenance - Nettoyage des branches fusionnées"

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete merged PR branch
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.pull_request.base.ref == 'develop' ||
           github.event.pull_request.base.ref == 'master') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Delete only unchanged merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            master|develop|release/*) exit 0 ;;
          esac
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/$BRANCH" --jq '.commit.sha' 2>/dev/null)" || {
            echo "Branch already deleted or unavailable"
            exit 0
          }
          if [[ "$current" != "$MERGED_HEAD_SHA" ]]; then
            echo "Branch changed since merge; preserving it"
            exit 0
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
          echo "Deleted merged branch: $BRANCH"
