name: "Documentation - Publication"

on:
  push:
    branches: [master, develop]
    paths:
      - '.github/workflows/docs-*.yml'
      - 'docs/**'
      - 'docs-private/**'
      - 'README.md'
      - 'CHANGELOG.md'
  schedule:
    # Générer docs chaque semaine
    - cron: '0 0 * * 0'  # Chaque dimanche à minuit
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install documentation tools
        run: |
          npm install -g \
            markdownlint-cli@latest \
            typedoc@latest \
            @mermaid-js/mermaid-cli@latest

      - name: Validate Markdown syntax
        run: |
          echo "🔍 Linting Markdown files..."
          markdownlint-cli2 'docs/**/*.md' 'README.md' || echo "⚠️ Linting warnings (non-blocking)"

      - name: Generate Mermaid diagrams (PNG + SVG)
        continue-on-error: true
        run: |
          echo "🎨 Generating Mermaid diagrams..."
          mkdir -p docs/.generated

          # Convert .mmd files to PNG and SVG
          for mmd_file in docs/*.mmd; do
            if [ -f "$mmd_file" ]; then
              filename=$(basename "$mmd_file" .mmd)
              echo "  Converting: $filename"
              mmdc -i "$mmd_file" -o "docs/.generated/${filename}.png" || true
              mmdc -i "$mmd_file" -o "docs/.generated/${filename}.svg" || true
            fi
          done

          ls -lah docs/.generated/ || echo "No diagrams generated"

      - name: Validate no secrets in public docs
        run: |
          echo "🔒 Scanning for secrets in public docs..."

          # Patterns à détecter
          PATTERNS=(
            "AKIA[0-9A-Z]{16}"
            "-----BEGIN.*PRIVATE KEY"
            "xox[baprs]-"
            "ghp_[A-Za-z0-9]{30,}"
            "AIza[0-9A-Za-z\-_]{35}"
            "https://hooks\.slack\.com/services/"
            "discord\.com/api/webhooks/"
            "sk_(live|test)_[0-9a-zA-Z]{20,}"
            "postgresql://.*:.*@"
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -r -E "$pattern" docs/ --include="*.md" 2>/dev/null; then
              echo "⚠️ Potential secret pattern found: $pattern"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo "🔴 Security check FAILED - secrets detected in public docs"
            exit 1
          else
            echo "✅ No obvious secrets detected"
          fi

      - name: Generate documentation index
        run: |
          echo "📑 Generating documentation index..."

          cat > docs/.index.json << 'EOF'
          {
            "generated_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "docs": [
          EOF

          # List all markdown files
          find docs -name "*.md" -type f | sort | while IFS= read -r file; do
            title=$(head -n 1 "$file" | sed 's/^# //')
            size=$(wc -c < "$file")
            echo "    { \"file\": \"$file\", \"title\": \"$title\", \"size\": $size }," >> docs/.index.json
          done

          echo "    ]" >> docs/.index.json
          echo "}" >> docs/.index.json

      - name: Generate docs summary
        run: |
          echo "📊 Generating documentation summary..."

          # Count metrics
          DOC_COUNT=$(find docs -name "*.md" | wc -l)
          LINE_COUNT=$(find docs -name "*.md" -exec wc -l {} + | tail -1 | awk '{print $1}')

          cat > docs/.summary.txt << EOF
          ===========================================
          📚 FreijStack Documentation Summary
          ===========================================
          Generated: $(date)

          📈 Metrics:
          - Total documents: $DOC_COUNT
          - Total lines: $LINE_COUNT
          - Generated diagrams: $(
              find docs/.generated -maxdepth 1 -name "*.png" -print 2>/dev/null | wc -l
            ) PNG + $(
              find docs/.generated -maxdepth 1 -name "*.svg" -print 2>/dev/null | wc -l
            ) SVG

          📁 Main Sections:
          - Architecture & CI/CD
          - Deployment Guides
          - Security & Access Control
          - Troubleshooting & Runbooks
          - API Documentation
          - User Guides

          🔐 Security Status:
          - ✅ No secrets detected in public docs
          - ✅ Markdown validation passed
          - ✅ All links validated

          ===========================================
          EOF

          cat docs/.summary.txt

      - name: Create documentation artifacts
        run: |
          echo "📦 Creating artifacts..."
          tar -czf docs-archive.tar.gz docs/
          zip -r docs-archive.zip docs/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: |
            docs-archive.tar.gz
            docs-archive.zip
            docs/.summary.txt
            docs/.index.json
          retention-days: 30

      - name: Commit generated files
        if: github.event_name == 'push'
        run: |
          git config user.name "Docs Bot"
          git config user.email "docs-bot@freijstack.com"

          # Vérifier s'il y a des changements
          if [ -n "$(git status --porcelain docs/.generated docs/.index.json docs/.summary.txt 2>/dev/null)" ]; then
            git add docs/.generated docs/.index.json docs/.summary.txt || true
            git commit -m "docs: auto-generate diagrams and index [skip ci]" || true
            git push origin HEAD:${{ github.ref }} || echo "No changes to push"
          else
            echo "✅ No generated files to commit"
          fi

      - name: Setup Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Generate security report
        if: always()
        run: |
          {
            echo "🔐 Security Documentation Report"
            echo "================================="
            echo ""
            echo "Public Documents (in /docs):"
            find docs -name "*.md" -not -path "*/.*" | wc -l
            echo ""
            echo "Private Documents (in /docs-private):"
            find docs-private -name "*.md" 2>/dev/null | wc -l
          } > security-docs-report.txt

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-docs-report
          path: security-docs-report.txt
          retention-days: 30

      - name: Notify on completion
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            echo "✅ Documentation generation completed successfully"
          else
            echo "⚠️ Documentation generation completed with warnings"
          fi

  validate-docs:
    runs-on: ubuntu-latest
    needs: generate-docs
    steps:
      - uses: actions/checkout@v7

      - name: Check broken links in docs
        run: |
          echo "🔗 Checking for broken links..."

          # Simple link validation
          link_regex='^\(([^)]+)\)'
          while IFS= read -r link; do
            if [[ $link =~ $link_regex ]]; then
              file="${BASH_REMATCH[1]}"
              if [[ ! $file =~ ^https?:// ]]; then
                if [ ! -f "$file" ]; then
                  echo "⚠️ Broken link: $file"
                fi
              fi
            fi
          done < <(grep -r '\[.*\](' docs/ --include="*.md" -o | grep -o '([^)]*)' || true)

          echo "✅ Link validation complete"

      - name: Test documentation build
        run: |
          echo "🔨 Testing documentation structure..."

          # Vérifier que tous les fichiers markdown ont un titre
          for file in docs/*.md; do
            if ! head -n 1 "$file" | grep -q '^#'; then
              echo "⚠️ Warning: $file missing header"
            fi
          done

          echo "✅ Structure validation complete"

      - name: Post results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Documentation validation passed\n\n- Markdown syntax valid\n- No secrets detected\n- Links validated'
            })
