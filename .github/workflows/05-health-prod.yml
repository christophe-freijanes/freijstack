name: "Supervision - Santé de la production"

on:
  workflow_dispatch:
    inputs:
      auto_heal:
        description: "🔧 Redémarrer automatiquement si problème détecté"
        required: false
        default: true
        type: boolean


concurrency:
  group: production-health-check
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  health-check:
    name: Check Production Health
    runs-on: ubuntu-latest
    timeout-minutes: 6

    outputs:
      backend_status: ${{ steps.backend.outputs.status }}
      db_status: ${{ steps.database.outputs.status }}
      leaks_count: ${{ steps.gitleaks.outputs.leaks_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ---------------------------
      # 🔐 SECURITY — Secret Scan (PROD = blocking)
      # ---------------------------
      - name: Secret scanning (Gitleaks CLI)
        if: github.event_name != 'schedule'
        id: gitleaks
        run: |
          set -euo pipefail

          echo "⬇️ Installing gitleaks (pinned version)..."
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

          echo "🔎 Running gitleaks (redacted)..."
          # On ne stoppe pas tout de suite pour pouvoir produire le report
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            --verbose || true

          # Garantit un JSON valide même si gitleaks n'a rien écrit
          test -f gitleaks-report.json || echo "[]" > gitleaks-report.json

          leaks_count="$(jq 'length' gitleaks-report.json)"
          echo "leaks_count=${leaks_count}" >> "$GITHUB_OUTPUT"
          echo "🔢 leaks_count=${leaks_count}"

          {
            echo ""
            echo "## 🔐 Gitleaks (secrets scan)"
            echo ""
            echo "- **Total findings:** $leaks_count"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$leaks_count" != "0" ]; then
            {
              echo ""
              echo "### 🔎 Top 20 findings (metadata only)"
              jq -r '.[] | "- rule=\(.RuleID) file=\(.File):\(.StartLine) commit=\(.Commit|tostring|.[0:8])"' gitleaks-report.json \
                | head -n 20
              echo ""
              echo "> ℹ️ Values are redacted. See artifact for full metadata."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ✅ No findings detected." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload gitleaks report (always)
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
          if-no-files-found: error

      - name: Fail pipeline if secrets found (PROD gate)
        if: ${{ github.event_name != 'schedule' && steps.gitleaks.outputs.leaks_count != '0' }}
        run: |
          echo "🚨 Secrets detected by Gitleaks. Blocking PROD healthcheck."
          exit 1

      - name: Prepare tools
        run: |
          set -euo pipefail
          echo "🧰 Tools versions"
          curl --version | head -n 1

      # ---------------------------
      # 🌐 AVAILABILITY — Frontend URLs with retries + sleep
      # ---------------------------
      - name: Public URLs Health Check (strong anti false-positives)
        run: |
          set -euo pipefail

          echo "## 🌐 Public URLs Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Warm-up: laisse le temps aux DNS/CDN/TLS de se stabiliser
          echo "⏳ Warm-up 15s..."
          sleep 15

          # Format: "url|allowed_codes|label"
          URLS=(
            "https://portfolio.freijstack.com/|200,301,302|Portfolio (production)"
            "https://registry.freijstack.com/v2/|401,200|Docker Registry API (production)"
            "https://registry-ui.freijstack.com/|200,301,302|Docker Registry UI (production)"
          )

          # Fast pass + Grace pass
          FAST_RETRY=3
          FAST_DELAY=8
          GRACE_RETRY=8
          GRACE_DELAY=15

          # Paramètres curl communs (anti faux positifs)
          # -4 : évite les soucis IPv6 (souvent la cause du HTTP 000)
          # --retry-all-errors + --retry-max-time : meilleure résilience
          # --connect-timeout : temps pour établir la connexion TCP
          # --max-time : temps total max par requête
          CURL_COMMON=(
            -4
            -sS
            -L
            -o /dev/null
            -w "%{http_code}"
            --connect-timeout 10
            --max-time 30
            --retry 2
            --retry-delay 3
            --retry-all-errors
            --retry-max-time 60
            --user-agent "freijstack-healthcheck/1.2"
          )

          check_url() {
            local url="$1"
            local allowed="$2"
            local label="$3"
            local attempts="$4"
            local delay="$5"

            echo ""
            echo "🔎 Checking $label → $url"
            echo "- **$label** ($url)" >> "$GITHUB_STEP_SUMMARY"

            # DNS debug
            host="$(echo "$url" | sed -E 's#https?://([^/]+).*#\1#')"
            if command -v dig >/dev/null 2>&1; then
              ips="$(dig +short "$host" | tr '\n' ' ' || true)"
              [ -n "${ips:-}" ] && echo "  🌐 DNS: $ips" || echo "  🌐 DNS: (no A/AAAA from runner)"
            fi

            for i in $(seq 1 "$attempts"); do
              echo "  ⏳ Attempt $i/$attempts..."

              # GET direct (HEAD peut être filtré sur certains proxys)
              code="$(curl "${CURL_COMMON[@]}" "$url" 2>/tmp/curl_err || echo "000")"

              if echo ",$allowed," | grep -q ",$code,"; then
                echo "  ✅ OK (HTTP $code)"
                echo "  - ✅ HTTP $code (attempt $i/$attempts)" >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi

              err="$(tail -n 1 /tmp/curl_err 2>/dev/null || true)"
              echo "  ⚠️  HTTP $code (attempt $i/$attempts) $err"

              # Si HTTP 000, on attend plus longtemps (souvent service pas prêt)
              if [ "$code" = "000" ] || [ "$code" = "502" ] || [ "$code" = "503" ]; then
                echo "  ⏳ Service warming up, waiting ${delay}s + grace period..."
                sleep $((delay + 5))
              elif [ "$i" -lt "$attempts" ]; then
                sleep "$delay"
              fi
            done

            echo "  ❌ FAILED after $attempts attempts"
            echo "  - ❌ Failed after $attempts attempts (last HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
            return 1
          }

          failures=0

          echo "### ⚡ Fast pass" >> "$GITHUB_STEP_SUMMARY"
          for entry in "${URLS[@]}"; do
            url="${entry%%|*}"
            rest="${entry#*|}"
            allowed="${rest%%|*}"
            label="${rest##*|}"

            if ! check_url "$url" "$allowed" "$label" "$FAST_RETRY" "$FAST_DELAY"; then
              failures=$((failures + 1))
            fi
          done

          if [ "$failures" -gt 0 ]; then
            {
              echo ""
              echo "### 🧯 Grace pass (final attempt)"
              echo "- Retrying with stronger tolerance..."
            } >> "$GITHUB_STEP_SUMMARY"

            failures=0
            for entry in "${URLS[@]}"; do
              url="${entry%%|*}"
              rest="${entry#*|}"
              allowed="${rest%%|*}"
              label="${rest##*|}"

              if ! check_url "$url" "$allowed" "$label" "$GRACE_RETRY" "$GRACE_DELAY"; then
                failures=$((failures + 1))
              fi
            done
          fi

          if [ "$failures" -gt 0 ]; then
            {
              echo ""
              echo "🚨 **Health check FAILED** (after grace pass)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo ""
            echo "✅ **All URLs healthy**"
          } >> "$GITHUB_STEP_SUMMARY"


      # ---------------------------
      # 🧠 API — Backend Health
      # ---------------------------
      - name: Check Backend SecureVault API (/api/health)
        id: backend
        run: |
          set -euo pipefail
          echo "## 🧠 Backend API" >> "$GITHUB_STEP_SUMMARY"

          url="https://vault.freijstack.com/api/health"
          echo "🔎 Checking $url ..."

          code=$(
            curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              --retry 2 --retry-delay 2 --retry-all-errors \
              "$url" || echo "000"
          )

          if [ "$code" = "200" ]; then
            echo "✅ Backend API OK (HTTP $code)"
            echo "status=healthy" >> "$GITHUB_OUTPUT"
            echo "- ✅ API healthy (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Backend API DOWN (HTTP $code)"
            echo "status=unhealthy" >> "$GITHUB_OUTPUT"
            echo "- ❌ API unhealthy (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # ---------------------------
      # 🔐 SSH — Database check
      # ---------------------------
      - name: Setup SSH (for DB check)
        id: ssh
        run: |
          set -euo pipefail

          # Validate secrets
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ VPS_SSH_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_SSH_HOST }}" ]; then
            echo "❌ VPS_SSH_HOST secret is not set"
            exit 1
          fi

          # Setup SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Scan SSH host keys with retry (5 attempts for GitHub runner stability)
          echo "🔍 Scanning SSH host keys for ${{ secrets.VPS_SSH_HOST }}..."
          for i in {1..5}; do
            if ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/tmp/ssh-scan-err; then
              echo "✅ SSH host keys retrieved (attempt $i/5)"
              break
            else
              echo "⚠️ Attempt $i/5 failed:"
              cat /tmp/ssh-scan-err || true
              if [ "$i" -eq 5 ]; then
                echo "❌ Cannot reach SSH host after 5 attempts"
                echo "Check: VPS firewall, SSH port 22, VPS_SSH_HOST secret"
                exit 1
              fi
              sleep 3
            fi
          done

          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" "echo '✅ SSH OK'"

      # ---------------------------
      # 🌐 NETWORK — Traefik connectivity check (ALL critical networks)
      # ---------------------------
      - name: Check Traefik Network Connectivity
        id: traefik_network
        run: |
          set -euo pipefail
          echo "## 🌐 Traefik Network" >> "$GITHUB_STEP_SUMMARY"

          SSH="ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}"

          echo "🔍 Checking Traefik connectivity to all critical networks..."

          # Critical networks: web (SecureVault, Registry, n8n) + freijstack (Portfolio)
          NETWORKS=("web" "freijstack")
          failed_networks=()

          for network in "${NETWORKS[@]}"; do
            echo "  📡 Checking network: $network"
            check=$(
              $SSH "docker network inspect $network 2>/dev/null | grep -q '\"Name\": \"traefik\"' && echo 'connected' || echo 'disconnected'"
            )

            if [ "$check" = "connected" ]; then
              echo "  ✅ Traefik connected to $network"
              echo "- ✅ Traefik ↔ $network: connected" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "  ❌ Traefik NOT connected to $network"
              echo "- ❌ Traefik ↔ $network: **disconnected**" >> "$GITHUB_STEP_SUMMARY"
              failed_networks+=("$network")
            fi
          done

          if [ ${#failed_networks[@]} -gt 0 ]; then
            echo "status=disconnected" >> "$GITHUB_OUTPUT"
            echo "failed_networks=${failed_networks[*]}" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "status=connected" >> "$GITHUB_OUTPUT"
            echo "failed_networks=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Database Connectivity (pg_isready)
        id: database
        run: |
          set -euo pipefail
          echo "## 🗄️ Database" >> "$GITHUB_STEP_SUMMARY"

          SSH="ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}"
          PROD_DIR="/srv/www/securevault/saas/securevault"

          echo "🗄️ Checking PostgreSQL (pg_isready)..."

          $SSH "cd '$PROD_DIR' && docker compose ps" || true

          db_status=$(
            $SSH "cd '$PROD_DIR' && docker compose exec -T postgres pg_isready -U securevault" 2>&1 || echo "FAILED"
          )

          if echo "$db_status" | grep -q "accepting connections"; then
            echo "✅ Database OK"
            echo "status=healthy" >> "$GITHUB_OUTPUT"
            echo "- ✅ DB accepting connections" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Database DOWN"
            echo "🔎 pg_isready output: $db_status"
            echo "status=unhealthy" >> "$GITHUB_OUTPUT"
            echo "- ❌ DB not ready" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key || true

  auto-heal:
    name: Auto-Heal Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: health-check

    if: >
      always() &&
      needs.health-check.result == 'failure' &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.auto_heal == true)
      )

    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail

          # Validate secrets
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ VPS_SSH_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_SSH_HOST }}" ]; then
            echo "❌ VPS_SSH_HOST secret is not set"
            exit 1
          fi

          # Setup SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Scan SSH host keys with retry (5 attempts for GitHub runner stability)
          echo "🔍 Scanning SSH host keys for ${{ secrets.VPS_SSH_HOST }}..."
          for i in {1..5}; do
            if ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/tmp/ssh-scan-err; then
              echo "✅ SSH host keys retrieved (attempt $i/5)"
              break
            else
              echo "⚠️ Attempt $i/5 failed:"
              cat /tmp/ssh-scan-err || true
              if [ "$i" -eq 5 ]; then
                echo "❌ Cannot reach SSH host after 5 attempts"
                echo "Check: VPS firewall, SSH port 22, VPS_SSH_HOST secret"
                exit 1
              fi
              sleep 3
            fi
          done

      - name: Auto-Heal cooldown check (anti restart-loop)
        id: cooldown
        run: |
          set -euo pipefail

          SSH="ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}"
          COOLDOWN_SECONDS=1800  # 30 minutes
          STAMP_FILE="/tmp/securevault_last_heal"

          echo "⏱️ Checking cooldown..."

          now=$($SSH "date +%s")
          last=$($SSH "test -f '$STAMP_FILE' && cat '$STAMP_FILE' || echo 0")
          diff=$((now - last))

          if [ "$diff" -lt "$COOLDOWN_SECONDS" ]; then
            echo "🛑 Cooldown active: last heal was $diff seconds ago (< $COOLDOWN_SECONDS)."
            echo "can_heal=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "✅ Cooldown passed. Auto-heal allowed."
            echo "can_heal=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restart Production Services
        if: ${{ steps.cooldown.outputs.can_heal == 'true' }}
        run: |
          set -euo pipefail

          SSH="ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}"

          $SSH << 'HEAL_SCRIPT'
            set -euo pipefail

            PROD_DIR="/srv/www/securevault/saas/securevault"
            STAMP_FILE="/tmp/securevault_last_heal"

            # ---------------------------
            # 🌐 Fix Traefik network connectivity first (ALL critical networks)
            # ---------------------------
            echo "🔍 Checking Traefik network connectivity..."
            NETWORKS=("web" "freijstack")
            reconnected=false

            for network in "${NETWORKS[@]}"; do
              echo "  📡 Checking network: $network"
              if ! docker network inspect "$network" 2>/dev/null | grep -q '"Name": "traefik"'; then
                echo "  ⚠️  Traefik not connected to $network, fixing..."
                docker network connect "$network" traefik 2>/dev/null || echo "  Already connected"
                reconnected=true
              else
                echo "  ✅ Traefik already connected to $network"
              fi
            done

            if [ "$reconnected" = true ]; then
              echo "🔄 Restarting Traefik to activate connections..."
              docker restart traefik
              sleep 10
              echo "✅ Traefik reconnected to all networks"
            else
              echo "✅ Traefik already connected to all networks"
            fi

            # ---------------------------
            # 🔄 Restart SecureVault services
            # ---------------------------
            cd "$PROD_DIR"

            echo "📊 Current container status:"
            docker compose ps || true
            echo ""

            echo "🔄 Restarting all production services..."
            docker compose restart

            echo "⏳ Waiting for services to stabilize..."
            sleep 25

            echo "📊 New container status:"
            docker compose ps || true
            echo ""

            echo "🔎 Checking backend health (internal)..."
            backend_health=$(docker compose exec -T backend curl -s http://localhost:3001/api/health || echo "FAILED")

            if echo "$backend_health" | grep -qi "ok"; then
              echo "✅ Auto-heal successful!"
              date +%s > "$STAMP_FILE"
            else
              echo "⚠️ Restart done but health still failing"
              echo "backend_health=$backend_health"
              exit 1
            fi
          HEAL_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key || true

  notify:
    name: Health Status Notification
    runs-on: ubuntu-latest
    needs: [health-check, auto-heal]
    if: always()
    timeout-minutes: 3

    steps:
      - name: Production Health Summary
        if: always()
        run: |
          set -euo pipefail

          {
            echo "## 📢 Production Health Summary"
            echo ""
            echo "- 🏥 Health Check: **${{ needs.health-check.result }}**"
            echo "- 🔧 Auto-Heal: **${{ needs.auto-heal.result }}**"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.health-check.result }}" = "success" ]; then
            {
              echo "✅ Production is **HEALTHY**"
              echo "- 🎯 https://vault.freijstack.com/login"
              echo "- 🎯 https://vault.freijstack.com/api/health"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.auto-heal.result }}" = "success" ]; then
            echo "⚠️ Production had issues but **auto-heal succeeded**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🚨 **CRITICAL**: Health check failed and auto-heal did not recover" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Console output
        run: |
          echo "🏥 Health Check: ${{ needs.health-check.result }}"
          echo "🔧 Auto-Heal: ${{ needs.auto-heal.result }}"
