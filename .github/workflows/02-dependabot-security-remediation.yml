name: "Sécurité - Validation des dépendances"

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: remediation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Identify changed components
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        name: Detect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/files"
          for area in backend frontend docker; do
            case "$area" in
              backend) pattern='^saas/securevault/backend/' ;;
              frontend) pattern='^saas/securevault/frontend/' ;;
              docker) pattern='^saas/portfolio/' ;;
            esac
            if grep -Eq "$pattern" "$RUNNER_TEMP/files"; then
              echo "$area=true" >> "$GITHUB_OUTPUT"
            else
              echo "$area=false" >> "$GITHUB_OUTPUT"
            fi
          done

  backend:
    name: SecureVault backend tests and audit
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: saas/securevault/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: saas/securevault/backend/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: SecureVault frontend tests, build and audit
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: saas/securevault/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: saas/securevault/frontend/package-lock.json
      - run: npm ci
      - name: Run frontend tests
        run: CI=true npm test -- --watchAll=false --runInBand
      - name: Build frontend
        run: CI=true npm run build
      - run: npm audit --omit=dev --audit-level=high

  portfolio:
    name: Portfolio image security gate
    needs: scope
    if: needs.scope.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build candidate image without publishing
        run: docker build --pull -t portfolio:pr-check saas/portfolio
      - name: Block fixable HIGH and CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: 'v0.76.0'
          scan-type: image
          image-ref: portfolio:pr-check
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  gate:
    name: Dependency validation gate
    if: always()
    needs: [scope, backend, frontend, portfolio]
    runs-on: ubuntu-24.04
    steps:
      - name: Require applicable security checks
        env:
          SCOPE: ${{ needs.scope.result }}
          NEED_BACKEND: ${{ needs.scope.outputs.backend }}
          BACKEND: ${{ needs.backend.result }}
          NEED_FRONTEND: ${{ needs.scope.outputs.frontend }}
          FRONTEND: ${{ needs.frontend.result }}
          NEED_PORTFOLIO: ${{ needs.scope.outputs.docker }}
          PORTFOLIO: ${{ needs.portfolio.result }}
        run: |
          set -euo pipefail
          [[ "$SCOPE" == success ]]
          for component in BACKEND FRONTEND PORTFOLIO; do
            required_var="NEED_$component"
            required="${!required_var}"
            result="${!component}"
            if [[ "$required" == true ]]; then
              [[ "$result" == success ]] || exit 1
            else
              [[ "$result" == skipped ]] || exit 1
            fi
          done
          echo "Dependency validation passed. Manual review still required."
