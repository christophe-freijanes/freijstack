name: "Sécurité - Inventaire des alertes"

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * *"

permissions:
  contents: read
  security-events: read

jobs:
  inventory:
    name: Inventorier les alertes ouvertes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Récupérer les alertes Code Scanning
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GH_REPO}/code-scanning/alerts?state=open&per_page=100" \
            > "$RUNNER_TEMP/code-scanning-pages.json"

      - name: Résumer par gravité, outil et fichier
        run: |
          set -euo pipefail
          python3 scripts/security/code_scanning_report.py \
            "$RUNNER_TEMP/code-scanning-pages.json" \
            "$RUNNER_TEMP/code-scanning-inventory"
          cat "$RUNNER_TEMP/code-scanning-inventory/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Conserver le bilan sans données sensibles
        uses: actions/upload-artifact@v7
        with:
          name: code-scanning-open-alerts
          path: ${{ runner.temp }}/code-scanning-inventory/
          retention-days: 7
