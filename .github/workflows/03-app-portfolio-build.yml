name: 🏗️ Build & Push Portfolio

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

  push:
    branches:
      - master
      - develop
    paths:
      - saas/portfolio/**

env:
  IMAGE_NAME: portfolio

jobs:
  build:
    name: Build & Push Portfolio
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    env:
      REGISTRY_HOST: registry.freijstack.com
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USER_PROD }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD_PROD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER_PROD }}
          password: ${{ secrets.REGISTRY_PASSWORD_PROD }}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./saas/portfolio
          file: ./saas/portfolio/Dockerfile
          push: true
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio
          tags: |
            registry.freijstack.com/portfolio:${{ github.sha }}
            registry.freijstack.com/portfolio:${{ github.ref_name == 'master' && 'latest' || 'develop' }}

      - name: Display image digest
        run: |
          echo "Image digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  security-scan:
    name: Security Scan Portfolio Image
    needs: build
    uses: ./.github/workflows/00-core-security-ci.yml
    with:
      environment: ${{ inputs.environment || 'production' }}
      run_trivy_image: true
      trivy_images: |
        registry.freijstack.com/portfolio:${{ github.sha }}
      registry_host: registry.freijstack.com
    secrets:
      REGISTRY_USER_PROD: ${{ secrets.REGISTRY_USER_PROD }}
      REGISTRY_PASSWORD_PROD: ${{ secrets.REGISTRY_PASSWORD_PROD }}
